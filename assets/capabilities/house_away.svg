<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!--
    Away = outline-only house, door open (panel shown ajar).
    The bottom wall is split: left section + right section with a gap for the doorway.
    The door panel is shown as a diagonal line from the hinge, indicating it is standing open.
  -->
  <!-- Roof -->
  <polyline points="2,11 12,2 22,11"/>
  <!-- Left wall -->
  <line x1="5"  y1="11" x2="5"  y2="22"/>
  <!-- Right wall -->
  <line x1="19" y1="11" x2="19" y2="22"/>
  <!-- Bottom wall — left of doorway -->
  <line x1="5"  y1="22" x2="9.5" y2="22"/>
  <!-- Bottom wall — right of doorway -->
  <line x1="14.5" y1="22" x2="19" y2="22"/>
  <!-- Door frame: left side + top (hinge on left) -->
  <line x1="9.5" y1="22" x2="9.5" y2="15"/>
  <line x1="9.5" y1="15" x2="14.5" y2="15"/>
  <!-- Door panel standing open: diagonal from hinge-top toward interior -->
  <line x1="9.5" y1="15" x2="14.5" y2="17.5"/>
</svg>
