<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <!--
    Clock icon — drawn entirely with filled shapes (no strokes).
    Outer face is a filled "donut" using even-odd fill-rule.
    Hands are thin rounded rectangles; the hour hand is rotated to 4 o'clock.
  -->

  <!-- Face: filled outer ring (donut via even-odd) -->
  <path fill-rule="evenodd" d="
    M12,2  A10,10 0 1,0 12,22 A10,10 0 1,0 12,2  Z
    M12,4.3 A7.7,7.7 0 1,0 12,19.7 A7.7,7.7 0 1,0 12,4.3 Z
  "/>

  <!-- Minute hand: points straight up to 12 -->
  <rect x="11.3" y="5.5" width="1.4" height="7" rx="0.7"/>

  <!-- Hour hand: shorter, rotated 120° clockwise → points to 4 -->
  <rect x="11.3" y="7.8" width="1.4" height="4.4" rx="0.7"
        transform="rotate(120 12 12)"/>

  <!-- Centre pivot -->
  <circle cx="12" cy="12" r="1.3"/>
</svg>
