<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <!--
    Network-node icon — drawn entirely with filled shapes (no strokes)
    because Homey's capability-icon renderer drops <line> strokes.
    Layout: 4 cardinal spokes from a hub, with nodes at each spoke tip.
  -->

  <!-- Spokes drawn FIRST so the hub/nodes overlap them cleanly -->
  <rect x="11.1" y="3.5"  width="1.8" height="8" rx="0.9"/>   <!-- top    -->
  <rect x="12.5" y="11.1" width="8"   height="1.8" rx="0.9"/> <!-- right  -->
  <rect x="11.1" y="12.5" width="1.8" height="8" rx="0.9"/>   <!-- bottom -->
  <rect x="3.5"  y="11.1" width="8"   height="1.8" rx="0.9"/> <!-- left   -->

  <!-- Outer nodes -->
  <circle cx="12" cy="3"  r="2.4"/>
  <circle cx="21" cy="12" r="2.4"/>
  <circle cx="12" cy="21" r="2.4"/>
  <circle cx="3"  cy="12" r="2.4"/>

  <!-- Centre hub -->
  <circle cx="12" cy="12" r="3.2"/>
</svg>
