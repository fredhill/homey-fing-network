<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!-- Hub and spoke: centre node + 4 outer nodes -->
  <!-- Spokes -->
  <line x1="12" y1="12" x2="12" y2="3"/>
  <line x1="12" y1="12" x2="20" y2="17"/>
  <line x1="12" y1="12" x2="4"  y2="17"/>
  <line x1="12" y1="12" x2="19" y2="6"/>
  <line x1="12" y1="12" x2="5"  y2="6"/>
  <!-- Outer nodes -->
  <circle cx="12" cy="3"  r="2" fill="currentColor" stroke="none"/>
  <circle cx="20" cy="17" r="2" fill="currentColor" stroke="none"/>
  <circle cx="4"  cy="17" r="2" fill="currentColor" stroke="none"/>
  <circle cx="19" cy="6"  r="1.5" fill="currentColor" stroke="none"/>
  <circle cx="5"  cy="6"  r="1.5" fill="currentColor" stroke="none"/>
  <!-- Centre hub (ring + core) -->
  <circle cx="12" cy="12" r="3.5" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.75"/>
  <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
</svg>
