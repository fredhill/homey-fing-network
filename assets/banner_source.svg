<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00b0b0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00b0b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00b0b0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00b0b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00b0b0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00b0b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="url(#bg)"/>

  <!-- ─── LEFT network cluster ─── -->
  <ellipse cx="170" cy="250" rx="130" ry="130" fill="url(#glowL)"/>
  <!-- spokes from left hub -->
  <line x1="170" y1="250" x2="80"  y2="150" stroke="#00b0b0" stroke-opacity="0.30" stroke-width="1.5"/>
  <line x1="170" y1="250" x2="80"  y2="350" stroke="#00b0b0" stroke-opacity="0.30" stroke-width="1.5"/>
  <line x1="170" y1="250" x2="270" y2="170" stroke="#00b0b0" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="170" y1="250" x2="270" y2="330" stroke="#00b0b0" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="170" y1="250" x2="50"  y2="250" stroke="#00b0b0" stroke-opacity="0.20" stroke-width="1.5"/>
  <!-- ring connections -->
  <line x1="80"  y1="150" x2="80"  y2="350" stroke="#00b0b0" stroke-opacity="0.10" stroke-width="1"/>
  <line x1="80"  y1="150" x2="270" y2="170" stroke="#00b0b0" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="80"  y1="350" x2="270" y2="330" stroke="#00b0b0" stroke-opacity="0.08" stroke-width="1"/>
  <!-- far-edge -->
  <line x1="50"  y1="250" x2="20"  y2="180" stroke="#00b0b0" stroke-opacity="0.10" stroke-width="1"/>
  <line x1="50"  y1="250" x2="20"  y2="320" stroke="#00b0b0" stroke-opacity="0.10" stroke-width="1"/>
  <!-- left hub node -->
  <circle cx="170" cy="250" r="22" fill="#00b0b0" fill-opacity="0.12" stroke="#00b0b0" stroke-width="2"/>
  <circle cx="170" cy="250" r="7"  fill="#00b0b0"/>
  <!-- ring nodes -->
  <circle cx="80"  cy="150" r="10" fill="#00b0b0" fill-opacity="0.08" stroke="#00b0b0" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="80"  cy="150" r="4"  fill="#00b0b0" fill-opacity="0.85"/>
  <circle cx="80"  cy="350" r="10" fill="#00b0b0" fill-opacity="0.08" stroke="#00b0b0" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="80"  cy="350" r="4"  fill="#00b0b0" fill-opacity="0.85"/>
  <circle cx="270" cy="170" r="8"  fill="#00b0b0" fill-opacity="0.08" stroke="#00b0b0" stroke-opacity="0.50" stroke-width="1.5"/>
  <circle cx="270" cy="170" r="3"  fill="#00b0b0" fill-opacity="0.8"/>
  <circle cx="270" cy="330" r="8"  fill="#00b0b0" fill-opacity="0.08" stroke="#00b0b0" stroke-opacity="0.50" stroke-width="1.5"/>
  <circle cx="270" cy="330" r="3"  fill="#00b0b0" fill-opacity="0.8"/>
  <circle cx="50"  cy="250" r="5"  fill="#00b0b0" fill-opacity="0.55"/>
  <circle cx="20"  cy="180" r="3"  fill="#00b0b0" fill-opacity="0.35"/>
  <circle cx="20"  cy="320" r="3"  fill="#00b0b0" fill-opacity="0.35"/>

  <!-- ─── RIGHT network cluster (mirror) ─── -->
  <ellipse cx="830" cy="250" rx="130" ry="130" fill="url(#glowR)"/>
  <line x1="830" y1="250" x2="920" y2="150" stroke="#00b0b0" stroke-opacity="0.30" stroke-width="1.5"/>
  <line x1="830" y1="250" x2="920" y2="350" stroke="#00b0b0" stroke-opacity="0.30" stroke-width="1.5"/>
  <line x1="830" y1="250" x2="730" y2="170" stroke="#00b0b0" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="830" y1="250" x2="730" y2="330" stroke="#00b0b0" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="830" y1="250" x2="950" y2="250" stroke="#00b0b0" stroke-opacity="0.20" stroke-width="1.5"/>
  <line x1="920" y1="150" x2="920" y2="350" stroke="#00b0b0" stroke-opacity="0.10" stroke-width="1"/>
  <line x1="920" y1="150" x2="730" y2="170" stroke="#00b0b0" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="920" y1="350" x2="730" y2="330" stroke="#00b0b0" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="950" y1="250" x2="980" y2="180" stroke="#00b0b0" stroke-opacity="0.10" stroke-width="1"/>
  <line x1="950" y1="250" x2="980" y2="320" stroke="#00b0b0" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="830" cy="250" r="22" fill="#00b0b0" fill-opacity="0.12" stroke="#00b0b0" stroke-width="2"/>
  <circle cx="830" cy="250" r="7"  fill="#00b0b0"/>
  <circle cx="920" cy="150" r="10" fill="#00b0b0" fill-opacity="0.08" stroke="#00b0b0" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="920" cy="150" r="4"  fill="#00b0b0" fill-opacity="0.85"/>
  <circle cx="920" cy="350" r="10" fill="#00b0b0" fill-opacity="0.08" stroke="#00b0b0" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="920" cy="350" r="4"  fill="#00b0b0" fill-opacity="0.85"/>
  <circle cx="730" cy="170" r="8"  fill="#00b0b0" fill-opacity="0.08" stroke="#00b0b0" stroke-opacity="0.50" stroke-width="1.5"/>
  <circle cx="730" cy="170" r="3"  fill="#00b0b0" fill-opacity="0.8"/>
  <circle cx="730" cy="330" r="8"  fill="#00b0b0" fill-opacity="0.08" stroke="#00b0b0" stroke-opacity="0.50" stroke-width="1.5"/>
  <circle cx="730" cy="330" r="3"  fill="#00b0b0" fill-opacity="0.8"/>
  <circle cx="950" cy="250" r="5"  fill="#00b0b0" fill-opacity="0.55"/>
  <circle cx="980" cy="180" r="3"  fill="#00b0b0" fill-opacity="0.35"/>
  <circle cx="980" cy="320" r="3"  fill="#00b0b0" fill-opacity="0.35"/>

  <!-- ─── Connecting lines between left and right clusters (through centre) ─── -->
  <line x1="270" y1="170" x2="730" y2="170" stroke="#00b0b0" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="270" y1="330" x2="730" y2="330" stroke="#00b0b0" stroke-opacity="0.08" stroke-width="1"/>

  <!-- ─── Centre glow ─── -->
  <ellipse cx="500" cy="250" rx="220" ry="160" fill="url(#glowC)"/>

  <!-- ─── Text (centred) ─── -->
  <!-- App name -->
  <text x="500" y="210"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1.5">
    Fing Network Monitor
  </text>

  <!-- Tagline -->
  <text x="500" y="262"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400" fill="#00c8c8" letter-spacing="0.3">
    Real-time presence detection for every device on your network
  </text>

  <!-- Divider -->
  <line x1="200" y1="292" x2="800" y2="292" stroke="#00b0b0" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Feature pills — centred row -->
  <!-- Pill 1: Presence Detection (width ~180) -->
  <rect x="218" y="312" width="178" height="36" rx="18" fill="#00b0b0" fill-opacity="0.13" stroke="#00b0b0" stroke-opacity="0.45" stroke-width="1"/>
  <text x="307" y="335" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" fill="#00d8d8">Presence Detection</text>

  <!-- Pill 2: Unknown Device Alerts (width ~204) -->
  <rect x="411" y="312" width="204" height="36" rx="18" fill="#00b0b0" fill-opacity="0.13" stroke="#00b0b0" stroke-opacity="0.45" stroke-width="1"/>
  <text x="513" y="335" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" fill="#00d8d8">Unknown Device Alerts</text>

  <!-- Pill 3: Powered by Fingbox (width ~180) -->
  <rect x="630" y="312" width="178" height="36" rx="18" fill="#00b0b0" fill-opacity="0.13" stroke="#00b0b0" stroke-opacity="0.45" stroke-width="1"/>
  <text x="719" y="335" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" fill="#00d8d8">Powered by Fingbox</text>
</svg>
