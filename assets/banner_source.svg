<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <!-- Teal glow for central node -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00b0b0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00b0b0" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle left glow -->
    <radialGradient id="glowLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00b0b0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00b0b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- ─── Network topology lines (behind nodes) ─── -->
  <!-- Central hub to surrounding nodes -->
  <line x1="180" y1="160" x2="90"  y2="80"  stroke="#00b0b0" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="180" y1="160" x2="90"  y2="240" stroke="#00b0b0" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="180" y1="160" x2="290" y2="80"  stroke="#00b0b0" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="180" y1="160" x2="290" y2="240" stroke="#00b0b0" stroke-opacity="0.25" stroke-width="1.5"/>
  <line x1="180" y1="160" x2="60"  y2="160" stroke="#00b0b0" stroke-opacity="0.20" stroke-width="1.5"/>
  <line x1="180" y1="160" x2="310" y2="160" stroke="#00b0b0" stroke-opacity="0.20" stroke-width="1.5"/>
  <!-- Second-ring connections -->
  <line x1="90"  y1="80"  x2="290" y2="80"  stroke="#00b0b0" stroke-opacity="0.10" stroke-width="1"/>
  <line x1="90"  y1="240" x2="290" y2="240" stroke="#00b0b0" stroke-opacity="0.10" stroke-width="1"/>
  <line x1="90"  y1="80"  x2="60"  y2="160" stroke="#00b0b0" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="90"  y1="240" x2="60"  y2="160" stroke="#00b0b0" stroke-opacity="0.08" stroke-width="1"/>
  <!-- Far-left faint ring -->
  <line x1="60"  y1="160" x2="20"  y2="100" stroke="#00b0b0" stroke-opacity="0.10" stroke-width="1"/>
  <line x1="60"  y1="160" x2="20"  y2="220" stroke="#00b0b0" stroke-opacity="0.10" stroke-width="1"/>

  <!-- ─── Glow under central hub ─── -->
  <ellipse cx="180" cy="160" rx="100" ry="100" fill="url(#glowCenter)"/>

  <!-- ─── Network nodes ─── -->
  <!-- Central hub — larger, fully lit -->
  <circle cx="180" cy="160" r="20" fill="#00b0b0" fill-opacity="0.15" stroke="#00b0b0" stroke-width="2"/>
  <circle cx="180" cy="160" r="6"  fill="#00b0b0"/>

  <!-- Ring nodes — medium -->
  <circle cx="90"  cy="80"  r="10" fill="#00b0b0" fill-opacity="0.08" stroke="#00b0b0" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="90"  cy="80"  r="4"  fill="#00b0b0" fill-opacity="0.8"/>
  <circle cx="290" cy="80"  r="10" fill="#00b0b0" fill-opacity="0.08" stroke="#00b0b0" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="290" cy="80"  r="4"  fill="#00b0b0" fill-opacity="0.8"/>
  <circle cx="90"  cy="240" r="10" fill="#00b0b0" fill-opacity="0.08" stroke="#00b0b0" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="90"  cy="240" r="4"  fill="#00b0b0" fill-opacity="0.8"/>
  <circle cx="290" cy="240" r="10" fill="#00b0b0" fill-opacity="0.08" stroke="#00b0b0" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="290" cy="240" r="4"  fill="#00b0b0" fill-opacity="0.8"/>

  <!-- Far edge nodes — small, dim -->
  <circle cx="60"  cy="160" r="5" fill="#00b0b0" fill-opacity="0.5"/>
  <circle cx="310" cy="160" r="5" fill="#00b0b0" fill-opacity="0.5"/>
  <circle cx="20"  cy="100" r="3" fill="#00b0b0" fill-opacity="0.35"/>
  <circle cx="20"  cy="220" r="3" fill="#00b0b0" fill-opacity="0.35"/>

  <!-- ─── Text block (right of network graphic) ─── -->
  <!-- App name -->
  <text x="380" y="138"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif"
        font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">
    Fing Network Monitor
  </text>

  <!-- Tagline -->
  <text x="382" y="182"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif"
        font-size="22" font-weight="400" fill="#00b0b0" letter-spacing="0.2">
    Real-time presence detection for every device on your network
  </text>

  <!-- Divider line -->
  <line x1="382" y1="205" x2="1100" y2="205" stroke="#00b0b0" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Feature pills -->
  <!-- Pill 1 -->
  <rect x="382" y="220" width="162" height="34" rx="17" fill="#00b0b0" fill-opacity="0.12" stroke="#00b0b0" stroke-opacity="0.4" stroke-width="1"/>
  <text x="463" y="242" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif"
        font-size="14" font-weight="500" fill="#00d0d0">Presence Detection</text>

  <!-- Pill 2 -->
  <rect x="558" y="220" width="170" height="34" rx="17" fill="#00b0b0" fill-opacity="0.12" stroke="#00b0b0" stroke-opacity="0.4" stroke-width="1"/>
  <text x="643" y="242" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif"
        font-size="14" font-weight="500" fill="#00d0d0">Unknown Device Alerts</text>

  <!-- Pill 3 -->
  <rect x="742" y="220" width="148" height="34" rx="17" fill="#00b0b0" fill-opacity="0.12" stroke="#00b0b0" stroke-opacity="0.4" stroke-width="1"/>
  <text x="816" y="242" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif"
        font-size="14" font-weight="500" fill="#00d0d0">Powered by Fingbox</text>
</svg>
