<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fingbox device icon: router/box shape with network indicator -->
  <rect x="10" y="30" width="80" height="45" rx="8" ry="8" fill="#00b0b0"/>
  <!-- LED dots -->
  <circle cx="25" cy="52" r="4" fill="#fff" opacity="0.9"/>
  <circle cx="38" cy="52" r="4" fill="#fff" opacity="0.6"/>
  <circle cx="51" cy="52" r="4" fill="#fff" opacity="0.9"/>
  <!-- Antenna left -->
  <line x1="30" y1="30" x2="22" y2="14" stroke="#00b0b0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="22" cy="14" r="4" fill="#00b0b0"/>
  <!-- Antenna right -->
  <line x1="70" y1="30" x2="78" y2="14" stroke="#00b0b0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="78" cy="14" r="4" fill="#00b0b0"/>
  <!-- Wifi arc -->
  <path d="M63 47 Q75 38 75 52" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M67 50 Q72 44 72 52" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85"/>
</svg>
