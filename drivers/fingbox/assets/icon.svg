<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Fingbox driver icon — stylised representation of the actual hardware:
    a short white plastic puck with a blue silicone sleeve wrapping the
    bottom half, viewed from a slight overhead angle so the white top
    surface is visible.
  -->

  <!-- App teal brand background -->
  <circle cx="50" cy="50" r="50" fill="#00b0b0"/>

  <!-- Drop shadow below the puck -->
  <ellipse cx="50" cy="72" rx="26" ry="2.5" fill="#000000" opacity="0.22"/>

  <!-- Bottom blue ellipse — back-bottom of the silicone sleeve. The side
       rect below covers the top half of this ellipse, leaving only the
       front-bottom curve visible, which gives the puck its 3D feel. -->
  <ellipse cx="50" cy="64" rx="30" ry="6" fill="#285FF5"/>

  <!-- Blue silicone sleeve wrapping the lower side of the cylinder -->
  <rect x="20" y="52" width="60" height="12" fill="#285FF5"/>

  <!-- Subtle highlight on the blue silicone (catches the light at top) -->
  <rect x="20" y="52" width="60" height="1.5" fill="#5b86ff"/>

  <!-- White plastic body — upper side of the cylinder -->
  <rect x="20" y="38" width="60" height="14" fill="#ffffff"/>

  <!-- White top surface of the puck -->
  <ellipse cx="50" cy="38" rx="30" ry="6" fill="#ffffff"/>

  <!-- Fing "O" mark in the centre of the top -->
  <circle cx="50" cy="38" r="3.6" fill="#285FF5"/>
  <circle cx="50" cy="38" r="1.4" fill="#ffffff"/>
</svg>
