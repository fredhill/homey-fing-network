<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fingbox device icon: rounded device shape with LED status dots
       and a wifi indicator. (Originally had antennas above the box;
       removed for a cleaner, more Fingbox-like silhouette.) -->

  <!-- Device body (rounded rect, centred vertically in the icon area) -->
  <rect x="10" y="30" width="80" height="45" rx="8" ry="8" fill="#00b0b0"/>

  <!-- LED status dots along the front of the device -->
  <circle cx="25" cy="52" r="4" fill="#fff" opacity="0.9"/>
  <circle cx="38" cy="52" r="4" fill="#fff" opacity="0.6"/>
  <circle cx="51" cy="52" r="4" fill="#fff" opacity="0.9"/>

  <!-- Wifi-signal indicator on the right side -->
  <path d="M63 47 Q75 38 75 52"
        stroke="#fff" stroke-width="3" fill="none"
        stroke-linecap="round" opacity="0.85"/>
  <path d="M67 50 Q72 44 72 52"
        stroke="#fff" stroke-width="2.5" fill="none"
        stroke-linecap="round" opacity="0.85"/>
</svg>
