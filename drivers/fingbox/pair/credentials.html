<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fingbox Credentials</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      padding: 24px;
      color: #333;
    }

    h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #111;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      color: #111;
      transition: border-color 0.15s;
    }

    input:focus {
      outline: none;
      border-color: #00b0b0;
    }

    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }

    #error-msg {
      display: none;
      background: #fff3f3;
      border: 1px solid #f5c6c6;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      color: #c0392b;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #00b0b0;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:hover { background: #009090; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>Enter Fingbox Details</h2>

  <div id="error-msg"></div>

  <form id="cred-form">
    <div class="field">
      <label for="ip">IP Address</label>
      <input id="ip" type="text" placeholder="10.0.0.75" autocomplete="off" required />
      <div class="hint">Local IP address of your Fingbox</div>
    </div>

    <div class="field">
      <label for="port">Port</label>
      <input id="port" type="number" value="49090" min="1" max="65535" required />
      <div class="hint">Fing Local API port (default: 49090)</div>
    </div>

    <div class="field">
      <label for="key">API Key</label>
      <input id="key" type="password" placeholder="Paste your Fing Local API key" autocomplete="off" required />
      <div class="hint">Find this in the Fing app: Fingbox → Settings → Local API</div>
    </div>

    <button type="submit" id="submit-btn">Connect</button>
  </form>

  <script src="/homey.js" data-origin="pair"></script>
  <script>
    function onHomeyReady(Homey) {
      Homey.ready();

      var form    = document.getElementById('cred-form');
      var errorEl = document.getElementById('error-msg');
      var btn     = document.getElementById('submit-btn');

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        var ip   = document.getElementById('ip').value.trim();
        var port = parseInt(document.getElementById('port').value, 10);
        var key  = document.getElementById('key').value.trim();

        if (!ip || !key) {
          showError('Please fill in all fields.');
          return;
        }

        if (isNaN(port) || port < 1 || port > 65535) {
          showError('Port must be a number between 1 and 65535.');
          return;
        }

        errorEl.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Connecting…';

        Homey.emit('test_connection', { ip: ip, port: port, key: key }, function (err, result) {
          btn.disabled = false;
          btn.textContent = 'Connect';

          if (err) {
            showError(err.message || 'Could not connect to Fingbox. Check your details and try again.');
          } else {
            WizardManager.nextView();
          }
        });
      });

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
      }
    }
  </script>

</body>
</html>
